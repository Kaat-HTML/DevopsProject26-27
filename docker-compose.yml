services:
  uptimekuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - uptimekuma_data:/app/data
    networks:
      - proxy
  discountbandit:
    image: cybrarist/discount-bandit:v4.0.5
    restart: unless-stopped
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/sqlite/database.sqlite
      APP_TIMEZONE: Europe/Brussels
      THEME_COLOR: Red
      APP_URL: http://discountbandit.localhost
      ASSET_URL: http://discountbandit.localhost
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY}
      APP_KEY: ${APP_KEY}
    volumes:
      - ./database/sqlite:/app/database/sqlite
      - ./logs:/logs
    networks:
      - proxy
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  adguard:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    ports:
      
      
      # DNS op poort 5353 om conflicten met je besturingssysteem te vermijden
      - "127.0.0.1:5300:53/tcp"
      - "127.0.0.1:5300:53/udp"
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    networks:
      - proxy

  airtrail:
    image: johly/airtrail:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ORIGIN: ${ORIGIN}
      DB_URL: postgres://airtrail:${DB_PASSWORD}@db:5432/airtrail
      ADDRESS_HEADER: X-Forwarded-For
    volumes:
      - airtrail_uploads:/app/uploads
    networks:
      - proxy
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airtrail
      POSTGRES_USER: airtrail
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - airtrail_db:/var/lib/postgresql/data
    networks:
      - backend

networks:
  proxy:
  backend:
    internal: true # geen internet, niet bereikbaar van buitenaf

volumes:
  caddy_data:
  caddy_config:
  airtrail_uploads:
  airtrail_db:
  discountbandit_db:
  discountbandit_logs:
  uptimekuma_data: